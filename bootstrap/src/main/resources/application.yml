server:
  # 服务端口
  port: 8080
  # servlet:
  #   context-path: /api

spring:
  application:
    name: hei-ddd-ai-lite
  # Spring AI：本地联调占位，未配置真实 Key 时仅保证启动
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-local-placeholder}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hei?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: infra123!
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      # 监控页（按需开启）
      # stat-view-servlet:
      #   enabled: true
      #   url-pattern: /druid/*
      #   login-username: admin
      #   login-password: admin
      # web-stat-filter:
      #   enabled: true
      #   url-pattern: /*
      #   exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: infra123!
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: io.github.jiangbyte.hei.infrastructure.persistence
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 基础设施与安全开关
hei:
  ddd:
    # Druid 数据源约定开关
    datasource:
      enabled: true
    # MyBatis-Plus：分页、元数据填充
    mybatis:
      enabled: true
    # Redis：RedisTemplate 序列化约定
    redis:
      enabled: true
    # CORS 跨域
    cors:
      enabled: true
      # 允许的来源（* 或具体域名，如 http://localhost:5173）
      allowed-origins:
        - "*"
      # 允许的请求头
      allowed-headers:
        - "*"
      # 允许的方法
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      # 是否允许携带 Cookie（为 true 时不要用 * 作精确 origin，已自动改用 pattern）
      allow-credentials: false
      # 预检缓存秒数
      max-age: 3600
    # 自实现 JWT 登录校验（配合 @RequireLogin）
    jwt:
      enabled: true
      # HMAC 密钥，长度建议 >= 32 字节，生产务必更换
      secret: hei-ddd-ai-lite-jwt-secret-change-me-32bytes!!
      # Token 过期秒数（默认 2 小时）
      expire-seconds: 7200
      # 请求头名称
      header: Authorization
      # Token 前缀（注意末尾空格）
      token-prefix: "Bearer "
      # 签发者
      issuer: hei-ddd-ai-lite
    # S3 兼容对象存储（AWS SDK；可对接 AWS S3 / MinIO / R2 / OSS S3 网关等）
    s3:
      enabled: true
      # 自建/兼容端点；对接官方 AWS 时留空即可
      endpoint: http://127.0.0.1:9000
      region: us-east-1
      access-key: admin
      secret-key: infra123!
      bucket: hei
      # MinIO 等兼容端点建议 true；官方 AWS 虚拟主机风格可改 false
      path-style-access: true
      create-bucket-if-absent: false
    # 向量库 Milvus（本地默认关闭，起好服务后改为 true）
    milvus:
      enabled: false
      uri: http://127.0.0.1:19530
      database: default
      # token: # 与 username/password 二选一，优先 token
      # username:
      # password:
      connect-timeout-ms: 10000
      ping-on-startup: true

# Knife4j / springdoc（Boot4 专用 starter）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: io.github.jiangbyte.hei.interfaces.web

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true


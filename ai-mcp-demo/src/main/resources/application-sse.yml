# SSE 传输：HTTP 长连接，适合远程 / 本机独立进程客户端
# 启动：java -jar ai-mcp-demo-1.0-SNAPSHOT.jar
# 或：  --spring.profiles.active=sse

server:
  port: 8101

spring:
  ai:
    mcp:
      server:
        # 显式 SSE（Spring AI 2.0 webmvc 默认可能是 STREAMABLE）
        protocol: SSE
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

logging:
  level:
    root: INFO
    io.github.jiangbyte.aimcp: DEBUG
